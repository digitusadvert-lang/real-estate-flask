<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Commission Calculator</title>
</head>
<body>
<noscript><div style="padding:40px;text-align:center;color:#ef4444;">JavaScript is required.</div></noscript>
<script>
var RANKS = {
 AGENCY95: { label:"Agency (95%)", pct:95, pillCls:"rp-ag95", hierCls:"hn-ag95", barCls:"bar-ag95" },
 AGENCY93: { label:"Agency (93%)", pct:93, pillCls:"rp-ag93", hierCls:"hn-ag93", barCls:"bar-ag93" },
 ATL: { label:"\x41\x54\x4c", pct:90, pillCls:"\x72\x70\x2d\x61\x74\x6c", hierCls:"\x68\x6e\x2d\x61\x74\x6c", barCls:"\x62\x61\x72\x2d\x61\x74\x6c" },
 TL: { label:"\x54\x4c", pct:85, pillCls:"\x72\x70\x2d\x74\x6c", hierCls:"\x68\x6e\x2d\x74\x6c", barCls:"\x62\x61\x72\x2d\x74\x6c" },
 ELITE: { label:"\x45\x6c\x69\x74\x65\x20\x52\x45\x4e", pct:80, pillCls:"\x72\x70\x2d\x65\x72", hierCls:"\x68\x6e\x2d\x65\x72", barCls:"\x62\x61\x72\x2d\x65\x72" },
 ASSOC: { label:"\x41\x73\x73\x6f\x63\x20\x52\x45\x4e", pct:75, pillCls:"\x72\x70\x2d\x61\x73", hierCls:"\x68\x6e\x2d\x61\x73", barCls:"\x62\x61\x72\x2d\x61\x73" },
 REN: { label:"\x52\x45\x4e", pct:70, pillCls:"\x72\x70\x2d\x72\x65\x6e", hierCls:"\x68\x6e\x2d\x72\x65\x6e", barCls:"\x62\x61\x72\x2d\x72\x65\x6e" }
};
var RANK_KEYS = ["AGENCY95","AGENCY93","\x41\x54\x4c","\x54\x4c","\x45\x4c\x49\x54\x45","\x41\x53\x53\x4f\x43","\x52\x45\x4e"];
var agentCount = 0;
var branchCount = 0;
var branches = [];
function __appInit() {
 updateGross();
 updatePicProject();
 updateRateSummary();
 renderPICList();
 /* Demo: Billy (Agency 95%) with 3 lines */
 branchCount++;
 var billy = makeAgent('AGENCY95', 'Billy', false);
 var jason  = makeAgent('TL',    'Jason',   true);  jason.children.push(makeAgent('REN','Barry',false));
 var michael= makeAgent('ATL',   'Michael', false); michael.children.push(makeAgent('REN','Jp',true)); michael.children.push(makeAgent('ASSOC','Sunny',false));
 var micky  = makeAgent('ATL',   'Micky',   false); micky.children.push(makeAgent('ELITE','Jimmy',true));
 billy.children.push(jason); billy.children.push(michael); billy.children.push(micky);
 branches.push({ id: branchCount, root: billy });
 renderBranches();
}
// ── NEW TREE-BASED BRANCH DATA MODEL ─────────────────────────────────────────
// Each branch has a root agent node.
// Each agent node: { id, rank, name, hasDeal, cobroke[], children[] }
// children[] = direct recruits under this agent

function makeAgent(rank, name, hasDeal) {
 agentCount++;
 return { id: agentCount, rank: rank || 'REN', name: name || '', hasDeal: !!hasDeal, cobroke: [], children: [] };
}

function addBranchData(agentsArr) {
 // Legacy: agentsArr is a flat list top→down (kept for __appInit)
 branchCount++;
 var root = makeAgent(agentsArr[0].rank, agentsArr[0].name, agentsArr[0].hasDeal);
 // Build simple chain: each agent is the only child of the previous
 var cur = root;
 for (var i = 1; i < agentsArr.length; i++) {
  var child = makeAgent(agentsArr[i].rank, agentsArr[i].name, agentsArr[i].hasDeal);
  cur.children.push(child);
  cur = child;
 }
 branches.push({ id: branchCount, root: root });
 renderBranches();
}

function addBranch() {
 branchCount++;
 var root = makeAgent('REN', '', false);
 branches.push({ id: branchCount, root: root });
 renderBranches();
}

function removeBranch(bid) {
 branches = branches.filter(function(b){ return b.id !== bid; });
 renderBranches();
}

// Find agent node anywhere in a branch tree by id
function findAgentInTree(node, aid) {
 if (!node) return null;
 if (node.id === aid) return node;
 for (var i = 0; i < node.children.length; i++) {
  var found = findAgentInTree(node.children[i], aid);
  if (found) return found;
 }
 return null;
}

function getBranch(bid) {
 for (var i = 0; i < branches.length; i++) if (branches[i].id === bid) return branches[i];
 return null;
}

function getAgent(bid, aid) {
 var b = getBranch(bid);
 return b ? findAgentInTree(b.root, aid) : null;
}

// Add a child agent under a parent agent
function addChildAgent(bid, parentId) {
 var parent = getAgent(bid, parentId);
 if (!parent) return;
 parent.children.push(makeAgent('REN', '', false));
 renderBranches();
}

// Remove an agent and all its descendants
function removeAgent(bid, aid) {
 var b = getBranch(bid);
 if (!b) return;
 // Can't remove root if it's the only agent
 if (b.root.id === aid) {
  if (branches.length > 1 || b.root.children.length === 0) {
   branches = branches.filter(function(br){ return br.id !== bid; });
  }
  renderBranches();
  return;
 }
 // Find parent and splice
 function removeFromParent(node) {
  for (var i = 0; i < node.children.length; i++) {
   if (node.children[i].id === aid) {
    node.children.splice(i, 1);
    return true;
   }
   if (removeFromParent(node.children[i])) return true;
  }
  return false;
 }
 removeFromParent(b.root);
 renderBranches();
}

function onBranchRankChange(bid, aid, val) {
 var a = getAgent(bid, aid);
 if (a) { a.rank = val; renderBranches(); }
}
function onBranchDealChange(bid, aid, checked) {
 var a = getAgent(bid, aid);
 if (a) { a.hasDeal = checked; renderBranches(); }
}
function onBranchNameChange(bid, aid, val) {
 var a = getAgent(bid, aid);
 if (a) a.name = val;
}

// ── RENDER BRANCHES (horizontal landscape tree) ──────────────────────────────
function renderBranches() {
 var container = document.getElementById('branchesRow');
 if (!container) { console.warn('[renderBranches] branchesRow not found'); return; }
 container.innerHTML = '';

 for (var bi = 0; bi < branches.length; bi++) {
  var b = branches[bi];
  var col = document.createElement('div');
  col.className = 'branch-col';

  // Branch header
  var hdr = document.createElement('div');
  hdr.className = 'branch-header';
  hdr.innerHTML =
   '<span class="branch-title">Branch ' + (bi+1) + '</span>' +
   '<button class="btn-del-branch" onclick="removeBranch(' + b.id + ')">Remove</button>';
  col.appendChild(hdr);

  // Horizontal scroll area for the top-down tree
  var treeScroll = document.createElement('div');
  treeScroll.style.cssText = 'width:100%;overflow-x:auto;overflow-y:visible;padding:12px 16px 20px;min-height:80px;box-sizing:border-box;';

  var treeRoot = document.createElement('div');
  treeRoot.style.cssText = 'display:flex;flex-direction:column;align-items:center;min-width:max-content;width:100%;';
  treeRoot.appendChild(buildHTree(b.id, b.root));
  treeScroll.appendChild(treeRoot);
  col.appendChild(treeScroll);

  container.appendChild(col);
 }

 // Add Branch button
 var addBtn = document.createElement('button');
 addBtn.className = 'add-branch-btn';
 addBtn.id = 'addBranchBtn';
 addBtn.onclick = addBranch;
 addBtn.textContent = '+ Add Branch';
 container.appendChild(addBtn);
}

/* Build a top-down tree: node on top, children in a row below */
function buildHTree(bid, agent) {
 var r = RANKS[agent.rank] || RANKS['REN'];
 var hasChildren = agent.children.length > 0;

 /* ── wrapper: column flex, node on top, children row below ── */
 var wrap = document.createElement('div');
 wrap.style.cssText = 'display:inline-flex;flex-direction:column;align-items:center;position:relative;padding:0 8px;';

 /* ── node card ── */
 var nodeEl = document.createElement('div');
 nodeEl.className = 'htree-node ' + r.barCls;
 nodeEl.id = 'htnode_' + bid + '_' + agent.id;

 var pill = document.createElement('span');
 pill.className = 'rank-pill ' + r.pillCls;
 pill.style.cssText = 'font-size:10px;padding:2px 8px;margin-bottom:4px;display:inline-block;';
 pill.textContent = r.label + ' ' + r.pct + '%';
 nodeEl.appendChild(pill);

 var nameEl = document.createElement('div');
 nameEl.className = 'htree-name';
 nameEl.textContent = agent.name || '(unnamed)';
 nodeEl.appendChild(nameEl);

 if (agent.hasDeal) {
  var dealBadge = document.createElement('div');
  dealBadge.className = 'htree-deal-badge';
  dealBadge.textContent = '● Deal';
  nodeEl.appendChild(dealBadge);
 }
 if (agent.cobroke && agent.cobroke.length > 0) {
  var cbBadge = document.createElement('div');
  cbBadge.className = 'htree-cb-badge';
  cbBadge.textContent = '↔ Co-broke';
  nodeEl.appendChild(cbBadge);
 }

 nodeEl.onclick = function(e) { e.stopPropagation(); toggleHTreeEdit(bid, agent.id); };
 wrap.appendChild(nodeEl);

 /* edit panel below the node */
 var editPanel = document.createElement('div');
 editPanel.className = 'htree-edit';
 editPanel.id = 'htedit_' + bid + '_' + agent.id;
 editPanel.style.display = 'none';
 editPanel.innerHTML = buildAgentEditHtml(bid, agent);
 wrap.appendChild(editPanel);

 if (hasChildren) {
  /* vertical stub down from node */
  var vStubDown = document.createElement('div');
  vStubDown.className = 'htree-vstub';
  wrap.appendChild(vStubDown);

  /* horizontal bar spanning all children */
  var childRow = document.createElement('div');
  childRow.style.cssText = 'display:flex;flex-direction:row;align-items:flex-start;position:relative;';

  /* calculate horizontal bar width after children are built */
  var childNodes = [];
  for (var ci = 0; ci < agent.children.length; ci++) {
   var childWrap = document.createElement('div');
   childWrap.style.cssText = 'display:flex;flex-direction:column;align-items:center;position:relative;';

   /* vertical stub down from bar to child node */
   var vStubUp = document.createElement('div');
   vStubUp.className = 'htree-vstub';
   childWrap.appendChild(vStubUp);

   childWrap.appendChild(buildHTree(bid, agent.children[ci]));
   childNodes.push(childWrap);
   childRow.appendChild(childWrap);
  }

  /* horizontal connector bar across all children (CSS pseudoelement via a div) */
  var hBar = document.createElement('div');
  hBar.className = 'htree-hbar';
  /* position absolute, stretched via JS after DOM insertion */
  hBar.style.cssText = 'position:absolute;top:0;height:2px;background:var(--border);pointer-events:none;';

  childRow.style.position = 'relative';
  childRow.appendChild(hBar);

  wrap.appendChild(childRow);

  /* stretch hBar after layout — use a tiny timeout so DOM has rendered widths */
  (function(bar, row, nodes) {
   setTimeout(function() {
    if (nodes.length < 2) {
     bar.style.left = '50%'; bar.style.width = '0';
     return;
    }
    var rowRect = row.getBoundingClientRect();
    var firstRect = nodes[0].getBoundingClientRect();
    var lastRect  = nodes[nodes.length-1].getBoundingClientRect();
    var left  = firstRect.left  + firstRect.width/2  - rowRect.left;
    var right = lastRect.left   + lastRect.width/2   - rowRect.left;
    bar.style.left  = left + 'px';
    bar.style.width = (right - left) + 'px';
   }, 0);
  })(hBar, childRow, childNodes);
 }

 return wrap;
}

/* Build the full edit panel HTML for an agent (same fields as before) */
function buildAgentEditHtml(bid, agent) {
 var r = RANKS[agent.rank] || RANKS['REN'];
 var rankOpts = '';
 for (var k = 0; k < RANK_KEYS.length; k++) {
  var rk = RANK_KEYS[k];
  rankOpts += '<option value="' + rk + '"' + (agent.rank === rk ? ' selected' : '') + '>' +
   RANKS[rk].label + ' (' + RANKS[rk].pct + '%)</option>';
 }
 var depth = getAgentDepth(bid, agent.id);
 return '<div style="padding:10px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;min-width:220px;margin-top:4px;">' +
  '<div style="margin-bottom:8px;"><select style="font-size:13px;" onchange="onBranchRankChange(' + bid + ',' + agent.id + ',this.value)">' + rankOpts + '</select></div>' +
  '<input type="text" value="' + escHtml(agent.name) + '" placeholder="Agent name" oninput="onBranchNameChange(' + bid + ',' + agent.id + ',this.value)" style="margin-bottom:8px;font-size:13px;"/>' +
  '<div class="toggle-wrap" style="margin-bottom:8px;">' +
  '<label class="tog"><input type="checkbox"' + (agent.hasDeal ? ' checked' : '') +
  ' onchange="onBranchDealChange(' + bid + ',' + agent.id + ',this.checked)"/>' +
  '<span class="tog-sl"></span></label>' +
  '<span class="tog-label">' + (agent.hasDeal ? 'Personal Deal ON' : 'Personal Deal OFF') + '</span>' +
  '</div>' +
  buildCobrokeHtml(bid, agent) +
  '<div style="display:flex;gap:6px;margin-top:8px;">' +
  '<button class="btn-add-down" onclick="addChildAgent(' + bid + ',' + agent.id + ')">+ Recruit</button>' +
  (depth > 0 ? '<button class="btn-remove" onclick="removeAgent(' + bid + ',' + agent.id + ')">Remove</button>' : '') +
  '</div>' +
  '</div>';
}

function getAgentDepth(bid, aid) {
 var b = getBranch(bid);
 if (!b) return 0;
 function search(node, depth) {
  if (node.id === aid) return depth;
  for (var i = 0; i < node.children.length; i++) {
   var d = search(node.children[i], depth + 1);
   if (d >= 0) return d;
  }
  return -1;
 }
 return Math.max(0, search(b.root, 0));
}

function toggleHTreeEdit(bid, aid) {
 var el = document.getElementById('htedit_' + bid + '_' + aid);
 var nodeEl = document.getElementById('htnode_' + bid + '_' + aid);
 if (!el) return;
 var open = el.style.display !== 'none';
 // Close all other panels in this branch
 var allPanels = document.querySelectorAll('[id^="htedit_' + bid + '_"]');
 var allNodes  = document.querySelectorAll('[id^="htnode_' + bid + '_"]');
 for (var i = 0; i < allPanels.length; i++) allPanels[i].style.display = 'none';
 for (var i = 0; i < allNodes.length;  i++) allNodes[i].classList.remove('htree-node-active');
 if (!open) {
  // Refresh edit html (pick up latest data)
  var a = getAgent(bid, aid);
  if (a) el.innerHTML = buildAgentEditHtml(bid, a);
  el.style.display = 'block';
  if (nodeEl) nodeEl.classList.add('htree-node-active');
 }
}

function buildCobrokeHtml(bid, agent) {
 var totalCb = 0;
 for (var i = 0; i < agent.cobroke.length; i++) totalCb += parseFloat(agent.cobroke[i].pct) || 0;
 var keeps = Math.max(0, 100 - totalCb);

 var html = '<div class="cobroke-section"><div class="cobroke-toggle-row">' +
  '<span class="cobroke-lbl">&#9654; Co-broke / Referral Share</span></div>';

 if (agent.cobroke.length > 0) {
  html += '<div class="cobroke-partners">';
  for (var i = 0; i < agent.cobroke.length; i++) {
   var cb = agent.cobroke[i];
   var rankOpts = '';
   for (var k = 0; k < RANK_KEYS.length; k++) {
    var rk = RANK_KEYS[k];
    rankOpts += '<option value="' + rk + '">' + RANKS[rk].label + ' (' + RANKS[rk].pct + '%)</option>';
   }
   // WTP chain UI
   var wtpHtml = '';
   if (cb.isWTP && cb.wtpChain) {
    wtpHtml = '<div class="wtp-chain-wrap"><div class="wtp-chain-label">Upline chain (top → down to co-broke)</div>';
    for (var j = 0; j < cb.wtpChain.length; j++) {
     var up = cb.wtpChain[j];
     var upOpts = '';
     for (var k = 0; k < RANK_KEYS.length; k++) {
      var rk = RANK_KEYS[k];
      upOpts += '<option value="' + rk + '"' + (up.rank === rk ? ' selected' : '') + '>' + RANKS[rk].label + ' (' + RANKS[rk].pct + '%)</option>';
     }
     wtpHtml += '<div class="wtp-chain-node"><div class="wtp-chain-row">' +
      '<input type="text" value="' + escHtml(up.name) + '" placeholder="Upline name" style="font-size:12px;" oninput="onWTPUplineNameChange(' + bid + ',' + agent.id + ',' + i + ',' + j + ',this.value)"/>' +
      '<select style="font-size:12px;" onchange="onWTPUplineRankChange(' + bid + ',' + agent.id + ',' + i + ',' + j + ',this.value)">' + upOpts + '</select>' +
      '<button class="wtp-del-btn" onclick="removeWTPUpline(' + bid + ',' + agent.id + ',' + i + ',' + j + ')">&#215;</button>' +
      '</div><div class="wtp-arrow">&#8595;</div></div>';
    }
    wtpHtml += '<div class="wtp-chain-node wtp-chain-bottom">' +
     '<span class="wtp-agent-pill">' + escHtml(cb.name || 'Co-broke agent') + ' (same rank as ' + escHtml(agent.name || RANKS[agent.rank].label) + ')</span></div>' +
     (cb.wtpChain.length < 3 ? '<button class="wtp-add-btn" onclick="addWTPUpline(' + bid + ',' + agent.id + ',' + i + ')">+ Add upline above</button>' : '') +
     '</div>';
   }
   html += '<div class="cobroke-partner-card">' +
    '<div class="cobroke-row">' +
    '<input type="text" value="' + escHtml(cb.name) + '" placeholder="Partner name" oninput="onCobrokeNameChange(' + bid + ',' + agent.id + ',' + i + ',this.value)"/>' +
    '<input type="number" value="' + escHtml(String(cb.pct)) + '" min="0" max="100" step="0.5" placeholder="%" oninput="onCobrokePctChange(' + bid + ',' + agent.id + ',' + i + ',this.value)"/>' +
    '<button class="cobroke-del-btn" onclick="removeCobrokePartner(' + bid + ',' + agent.id + ',' + i + ')">&#215;</button></div>' +
    '<div class="wtp-toggle-row"><label class="tog" style="width:34px;height:19px;"><input type="checkbox"' + (cb.isWTP ? ' checked' : '') +
    ' onchange="onCobrokeWTPChange(' + bid + ',' + agent.id + ',' + i + ',this.checked)"/><span class="tog-sl"></span></label>' +
    '<span style="font-size:12px;color:' + (cb.isWTP ? 'var(--amber)' : 'var(--muted)') + ';font-weight:600;">' +
    (cb.isWTP ? 'WTP Agent — upline gets override' : 'External agent — no upline') + '</span></div>' +
    wtpHtml + '</div>';
  }
  html += '</div>';
  var overStat = totalCb > 100 ? 'bad' : 'ok';
  var statText = totalCb > 100 ? 'Exceeds 100%!' : (totalCb === 0 ? 'Enter %' : escHtml(agent.name || RANKS[agent.rank].label) + ' keeps ' + keeps.toFixed(1).replace(/\.0$/,'') + '%');
  html += '<div class="cobroke-status ' + overStat + '" id="cbStatus_' + bid + '_' + agent.id + '">' + statText + '</div>';
 }
 html += '<button class="cobroke-add-btn" onclick="addCobrokePartner(' + bid + ',' + agent.id + ')">+ Add Co-broke Partner</button>';
 html += '</div>';
 return html;
}

// ── CO-BROKE HANDLER FUNCTIONS ────────────────────────────────────────────────
function addCobrokePartner(bid, aid) {
 var a = getAgent(bid, aid);
 if (!a) return;
 a.cobroke.push({ name:'', pct:'', isWTP:false, wtpChain:[] });
 renderBranches();
}
function removeCobrokePartner(bid, aid, idx) {
 var a = getAgent(bid, aid);
 if (!a) return;
 a.cobroke.splice(idx, 1);
 renderBranches();
}
function onCobrokeNameChange(bid, aid, idx, val) {
 var a = getAgent(bid, aid);
 if (a && a.cobroke[idx] !== undefined) a.cobroke[idx].name = val;
}
function onCobrokePctChange(bid, aid, idx, val) {
 var a = getAgent(bid, aid);
 if (!a || a.cobroke[idx] === undefined) return;
 a.cobroke[idx].pct = val;
 /* live status update without full re-render */
 var el = document.getElementById('cbStatus_' + bid + '_' + aid);
 if (!el) return;
 var total = 0;
 for (var i = 0; i < a.cobroke.length; i++) total += parseFloat(a.cobroke[i].pct) || 0;
 var keeps = Math.max(0, 100 - total);
 el.className = 'cobroke-status ' + (total > 100 ? 'bad' : 'ok');
 el.textContent = total > 100 ? 'Exceeds 100%!' : (total === 0 ? 'Enter %' : (a.name || RANKS[a.rank].label) + ' keeps ' + keeps.toFixed(1).replace(/\.0$/,'') + '%');
}
function onCobrokeWTPChange(bid, aid, idx, checked) {
 var a = getAgent(bid, aid);
 if (!a || a.cobroke[idx] === undefined) return;
 a.cobroke[idx].isWTP = checked;
 if (checked && a.cobroke[idx].wtpChain.length === 0) {
  a.cobroke[idx].wtpChain.push({ name:'', rank:'TL' });
 }
 renderBranches();
}
function addWTPUpline(bid, aid, cbIdx) {
 var a = getAgent(bid, aid);
 if (!a || !a.cobroke[cbIdx]) return;
 a.cobroke[cbIdx].wtpChain.unshift({ name:'', rank:'TL' });
 renderBranches();
}
function removeWTPUpline(bid, aid, cbIdx, chainIdx) {
 var a = getAgent(bid, aid);
 if (!a || !a.cobroke[cbIdx]) return;
 a.cobroke[cbIdx].wtpChain.splice(chainIdx, 1);
 if (a.cobroke[cbIdx].wtpChain.length === 0) a.cobroke[cbIdx].isWTP = false;
 renderBranches();
}
function onWTPUplineNameChange(bid, aid, cbIdx, chainIdx, val) {
 var a = getAgent(bid, aid);
 if (a && a.cobroke[cbIdx] && a.cobroke[cbIdx].wtpChain[chainIdx] !== undefined) {
  a.cobroke[cbIdx].wtpChain[chainIdx].name = val;
 }
}
function onWTPUplineRankChange(bid, aid, cbIdx, chainIdx, val) {
 var a = getAgent(bid, aid);
 if (a && a.cobroke[cbIdx] && a.cobroke[cbIdx].wtpChain[chainIdx] !== undefined) {
  a.cobroke[cbIdx].wtpChain[chainIdx].rank = val;
  renderBranches();
 }
}

// ── FLATTEN TREE for commission calculation ────────────────────────────────────
// Returns a flat ordered array [root, ...descendants] top-down (BFS level order)
// but preserving upline-before-downline so override gaps work correctly.
// Each item: { agent, upline } where upline is direct parent agent or null.
function flattenBranchTree(root) {
 var result = [];
 function walk(node, parent) {
  result.push({ agent: node, upline: parent });
  for (var i = 0; i < node.children.length; i++) {
   walk(node.children[i], node);
  }
 }
 walk(root, null);
 return result;
}


function updateGross() {
 var _dejTYe0W = parseFloat(document.getElementById("\x73\x61\x6c\x65\x73\x50\x72\x69\x63\x65").value) || 0;
 var _ec2lfxBz = parseFloat(document.getElementById("\x64\x65\x76\x43\x6f\x6d\x6d\x52\x61\x74\x65").value) || 0;
 document.getElementById("\x67\x72\x6f\x73\x73\x43\x6f\x6d\x6d").value = (_dejTYe0W * _ec2lfxBz / 100).toFixed(2);
 updateRateSummary();

'.branch-col{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px;width:100%;box-sizing:border-box}'+
/* Node card */
'.htree-card-wrap{display:flex;flex-direction:column;align-items:flex-start;position:relative}'+
'.htree-node{cursor:pointer;border-radius:10px;padding:8px 14px;min-width:110px;max-width:150px;border-left:3px solid transparent;background:var(--surface2);border:1px solid var(--border);transition:all .15s;user-select:none;position:relative}'+
'.htree-node:hover{border-color:var(--blue);background:rgba(59,130,246,.08)}'+
'.htree-node-active{border-color:var(--blue)!important;background:rgba(59,130,246,.12)!important;box-shadow:0 0 0 2px rgba(59,130,246,.2)}'+
'.htree-name{font-size:13px;font-weight:700;color:#fff;margin:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}'+
'.htree-deal-badge{font-size:10px;color:var(--green);font-weight:700;margin-top:2px}'+
'.htree-cb-badge{font-size:10px;color:var(--amber);font-weight:700;margin-top:1px}'+
/* Edit panel */
'.htree-edit{position:relative;z-index:10;margin-top:4px}'+
/* Connectors — top-down tree */
'.htree-vstub{width:2px;height:20px;background:var(--border);margin:0 auto;flex-shrink:0}'+
'.htree-hbar-row{position:relative;display:flex;flex-direction:row;align-items:flex-start}'+
/* Branch-col override: full width, horizontal scroll */
'.branch-col .branch-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}'+
'.branch-col{overflow-x:auto}'+
/* Bar colours for top strip on nodes */
'.htree-node.bar-atl{border-top:3px solid #3b6fd4}'+
'.htree-node.bar-tl{border-top:3px solid #2a7a44}'+
'.htree-node.bar-er{border-top:3px solid #c07820}'+
'.htree-node.bar-as{border-top:3px solid #2a7890}'+
'.htree-node.bar-ren{border-top:3px solid #7c3aed}'+
'.htree-node.bar-ag95{border-top:3px solid #7c3aed}'+
'.htree-node.bar-ag93{border-top:3px solid #9333ea}'+
/* btn-add-down keep styling */
'.btn-add-down{background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.25);border-radius:8px;padding:6px 10px;color:#93c5fd;font-size:12px;font-weight:700;cursor:pointer;font-family:"Segoe UI",Arial,sans-serif;transition:all .15s;white-space:nowrap}'+
'.btn-add-down:hover{background:rgba(59,130,246,.18)}';
