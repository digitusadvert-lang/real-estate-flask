<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <style>
    *,*::before,*::after{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}
    body{overflow-x:hidden}
    .nav{display:flex;flex-wrap:wrap;gap:4px 0}
    .nav a{white-space:nowrap;margin-right:12px}
    .tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;width:100%}
    table{min-width:480px}
    @media(max-width:640px){
      .form-layout,.grid2,.grid3{grid-template-columns:1fr!important}
      .stats{flex-wrap:wrap}
      .stat-card{min-width:120px}
      .header{flex-direction:column;gap:8px}
      .card,.form-container{padding:12px!important}
      .btn{width:100%!important;margin-bottom:6px!important}
      th,td{padding:8px 10px!important;font-size:12px}
    }
    @media(max-width:480px){
      body{font-size:13px;margin:8px!important}
      h1{font-size:1.1rem}
    }
    </style>
    <title>Error - Real Estate System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background-color: #f8f9fa;
        }
        .error-box {
            border: 2px solid #dc3545;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            background-color: white;
        }
        h2 {
            color: #dc3545;
        }
        .error-details {
            text-align: left;
            background: #f8d7da;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
            color: #721c24;
        }
        .actions {
            margin-top: 30px;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            margin: 0 10px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
        .btn-primary {
            background: #007bff;
            color: white;
        }
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
    </style>
</head>
<body>
    <div class="error-box">
        <h2>❌ Error Occurred</h2>
        
        <div class="error-details">
            <p><strong>Error:</strong> {{ error_message }}</p>
            {% if error_details %}
            <p><strong>Details:</strong> {{ error_details }}</p>
            {% endif %}
        </div>
        
        <div class="actions">
            <a href="javascript:history.back()" class="btn btn-primary">⬅️ Go Back</a>
            <a href="/agent/dashboard" class="btn btn-secondary">📊 Dashboard</a>
        </div>
        
        {% if support_email %}
        <p style="margin-top: 20px; color: #666; font-size: 14px;">
            If the problem persists, contact support at: {{ support_email }}
        </p>
        {% endif %}
    </div>
</body>
</html>
